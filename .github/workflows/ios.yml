name: iOS CI / Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test iOS (Liquid Glass)
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

    - name: Run Swift Unit Tests
      run: |
        cd iosApp
        swift test

    - name: Archive iOS Source & Package Artifact
      run: |
        zip -r NurPray-iOS-LiquidGlass-v1.3.0.zip iosApp/
      
    - name: Upload iOS Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NurPray-iOS-LiquidGlass
        path: NurPray-iOS-LiquidGlass-v1.3.0.zip
        retention-days: 14
